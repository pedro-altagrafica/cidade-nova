<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#101826">
<meta name="description" content="Cidade Nova — construa e administre a sua cidade em 3D.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cidade Nova">
<title>Cidade Nova</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700;800&display=swap">
<style>
/* Layout: tela cheia de 3D; HUD fixo no topo, barra de ferramentas fixa embaixo, painel como folha inferior (celular) ou gaveta à direita (PC). Visual único escuro-translúcido sobre a cidade. */
:root {
  --bg: #0f1420;
  --glass: rgba(14, 19, 30, 0.84);
  --glass-2: rgba(24, 31, 46, 0.94);
  --fg: #eef2f8;
  --muted: #9eabc0;
  --line: rgba(255, 255, 255, 0.1);
  --accent: #ffbf47;
  --accent-ink: #2a1d00;
  --good: #5fd38a;
  --warn: #ffcf5a;
  --bad: #ff6b6b;
  --info: #6fb6ff;
  --zr: #5fd38a;
  --zc: #6fb6ff;
  --zi: #f3c04b;
  --font-display: 'Fredoka', 'Nunito', system-ui, sans-serif;
  --font-body: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --radius: 14px;
  --gutter-l: max(12px, env(safe-area-inset-left, 0px));
  --gutter-r: max(12px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
h2, h4 { font-family: var(--font-display); font-weight: 600; letter-spacing: 0.01em; text-wrap: balance; }
h4 { margin: 14px 0 6px; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-family: var(--font-body); font-weight: 700; }
h4 span { color: var(--fg); text-transform: none; letter-spacing: 0; }
small { color: var(--muted); }
.good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }

#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

/* ---------- HUD ---------- */
#hud { position: fixed; top: 0; left: 0; right: 0; z-index: 5; pointer-events: none; display: flex; flex-direction: column; gap: 6px;
  padding-top: calc(8px + env(safe-area-inset-top, 0px)); padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.hud-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
.hud-row > * { pointer-events: auto; }
.chip { display: inline-flex; align-items: center; gap: 5px; background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 13px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.chip small { font-size: 11px; font-weight: 700; margin-left: 2px; }
.chip.neg { border-color: var(--bad); }
.icon-btn { width: 36px; height: 36px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass); font-size: 18px; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.city-name { display: flex; flex-direction: column; min-width: 0; line-height: 1.05; margin-right: auto; background: var(--glass); border: 1px solid var(--line); border-radius: 12px; padding: 4px 10px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.city-name b { font-family: var(--font-display); font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 38vw; }
.city-name span { font-size: 11px; color: var(--accent); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
.hud-row.second { gap: 8px; flex-wrap: wrap; }
.chip.date { font-weight: 700; color: var(--muted); }
.speed { display: inline-flex; background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 2px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.speed button { border: 0; background: transparent; border-radius: 999px; padding: 4px 9px; font-size: 12px; font-weight: 800; letter-spacing: -0.05em; color: var(--muted); }
.speed button.on { background: var(--accent); color: var(--accent-ink); }
.rci { display: inline-flex; gap: 5px; align-items: flex-end; background: var(--glass); border: 1px solid var(--line); border-radius: 12px; padding: 4px 8px; margin-left: auto; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.rci .bar { position: relative; width: 12px; height: 26px; background: rgba(255, 255, 255, 0.07); border-radius: 4px; overflow: hidden; }
.rci .bar::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(255, 255, 255, 0.25); }
.rci .bar i { position: absolute; left: 0; right: 0; bottom: 50%; height: 0; border-radius: 3px; transition: height 0.4s, bottom 0.4s; }
.rci .bar.r i { background: var(--zr); } .rci .bar.c i { background: var(--zc); } .rci .bar.i i { background: var(--zi); }
.rci .lb { font-size: 10px; font-weight: 800; color: var(--muted); display: block; text-align: center; margin-top: 2px; }
#hud-warn { background: rgba(255, 107, 107, 0.18); border-color: var(--bad); color: #ffd1d1; cursor: pointer; }
#hud-warn[data-kind=issue] { background: rgba(255, 207, 90, 0.14); border-color: rgba(255, 207, 90, 0.6); color: #ffe6a8; }
.chip.news { position: relative; padding: 4px 9px; font-size: 15px; line-height: 1; cursor: pointer; }
#news-badge { position: absolute; top: -6px; right: -6px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px; background: var(--bad); color: #fff; font-size: 10px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; border: 1px solid rgba(0, 0, 0, 0.35); }
#news-badge[hidden] { display: none; }

/* ---------- dicas e avisos ---------- */
.hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(176px + env(safe-area-inset-bottom, 0px)); z-index: 4; max-width: min(88vw, 460px); width: max-content; background: var(--glass); border: 1px solid var(--line); border-radius: 10px; padding: 5px 10px; font-size: 11.5px; line-height: 1.3; color: var(--muted); pointer-events: none; text-align: center; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
#toasts { position: fixed; top: calc(96px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 6; display: flex; flex-direction: column; gap: 6px; width: min(88vw, 340px); pointer-events: none; }
.toast { background: var(--glass-2); border: 1px solid var(--line); border-left: 4px solid var(--info); border-radius: 10px; padding: 6px 10px; font-size: 12px; line-height: 1.3; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3); animation: toast-in 0.25s ease-out; pointer-events: auto; cursor: pointer; }
/* pílula de confirmação: o segundo toque no mesmo lugar constrói; aqui só o resumo e o ✕ */
#confirm { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(172px + env(safe-area-inset-bottom, 0px)); z-index: 5; display: inline-flex; align-items: center; gap: 6px; max-width: 94vw; background: var(--glass-2); border: 1px solid rgba(255, 191, 71, 0.55); border-radius: 999px; padding: 3px 4px 3px 12px; font-size: 12px; line-height: 1.2; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); animation: toast-in 0.2s ease-out; }
#confirm[hidden] { display: none; }
#confirm-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#confirm-text small { color: var(--muted); font-size: 11.5px; margin-left: 4px; }
#confirm-text small.bad { color: var(--bad); }
#confirm-cancel { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.06); font-size: 12px; font-weight: 800; padding: 0; flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; }
.toast.good { border-left-color: var(--good); } .toast.warn { border-left-color: var(--warn); } .toast.bad { border-left-color: var(--bad); }
.toast.out { opacity: 0; transform: translateY(-6px); transition: opacity 0.35s, transform 0.35s; }
.toast.act { display: flex; flex-wrap: nowrap; gap: 8px; align-items: center; }
.toast.act span { flex: 1 1 auto; min-width: 0; }
.toast.act .btn.small { padding: 4px 9px; font-size: 11.5px; }
@keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

/* ---------- barra de ferramentas ---------- */
#toolbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding-top: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); padding-left: var(--gutter-l); padding-right: var(--gutter-r); background: linear-gradient(to top, rgba(8, 12, 20, 0.8), rgba(8, 12, 20, 0)); display: flex; flex-direction: column; gap: 6px; }
.tools { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; -webkit-overflow-scrolling: touch; }
.tools::-webkit-scrollbar { display: none; }
.tools.sub { padding-top: 6px; }
.cat, .tool { flex: 0 0 auto; min-width: 60px; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 6px 5px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass); font-size: 11px; font-weight: 700; line-height: 1.1; position: relative; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.cat .ic, .tool .ic { font-size: 20px; line-height: 1; }
.tool { background: rgba(24, 31, 46, 0.8); min-width: 64px; }
.tool .cost { font-size: 10px; color: var(--muted); font-weight: 700; }
.cat.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tool.on { background: var(--info); color: #06162b; border-color: var(--info); }
.tool.on .cost { color: #06162b; opacity: 0.8; }
.tool.locked { opacity: 0.55; }
.tool.rot { border-style: dashed; }
.tool .lock { position: absolute; top: -6px; right: -4px; background: var(--glass-2); border: 1px solid var(--line); border-radius: 999px; font-size: 9px; padding: 1px 5px; color: var(--warn); }
.chip.mission { border-color: rgba(255, 191, 71, 0.5); color: var(--fg); max-width: 56vw; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.mission.current { background: rgba(255, 191, 71, 0.1); border: 1px solid rgba(255, 191, 71, 0.4); border-radius: 12px; padding: 10px 12px; margin: 6px 0; }
.mission .mh { display: flex; flex-direction: column; gap: 2px; }
.mission .num { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); font-weight: 800; }
.mission .mh b { font-family: var(--font-display); font-size: 17px; font-weight: 600; }
.mission p { margin: 6px 0; font-size: 13.5px; line-height: 1.4; }
ul.done { list-style: none; padding: 0; margin: 0; }
ul.done li { padding: 4px 0; font-size: 13px; border-bottom: 1px dashed var(--line); }
ul.done.muted li { color: var(--muted); }
ul.news { list-style: none; padding: 0; margin: 0; }
ul.news li { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; padding: 6px 0 6px 8px; margin: 3px 0; border-left: 3px solid var(--info); font-size: 13px; line-height: 1.35; }
ul.news li.warn { border-left-color: var(--warn); } ul.news li.good { border-left-color: var(--good); } ul.news li.bad { border-left-color: var(--bad); }
ul.news li small { flex: 1 1 100%; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
ul.news li span { flex: 1 1 200px; }
.issue { margin: 2px 0 8px; }
.issue .row { border-bottom: 0; padding-bottom: 2px; }
.issue .sub { margin: 0; }
.advisor-ok { border: 1px solid rgba(95, 211, 138, 0.4); background: rgba(95, 211, 138, 0.08); border-radius: 12px; padding: 8px 12px; }
.ach { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.ach-card { border: 1px solid var(--line); border-radius: 10px; padding: 8px; opacity: 0.6; display: flex; flex-direction: column; gap: 2px; }
.ach-card.got { opacity: 1; border-color: rgba(255, 191, 71, 0.5); background: rgba(255, 191, 71, 0.08); }
.ach-card b { font-size: 13px; } .ach-card small { line-height: 1.3; }
.photo { width: 100%; height: auto; border-radius: 10px; display: block; margin: 8px 0; }

/* ---------- painel ---------- */
#panel { position: fixed; left: 0; right: 0; bottom: calc(160px + env(safe-area-inset-bottom, 0px)); z-index: 4; max-height: 52%; background: var(--glass-2); border: 1px solid var(--line); border-bottom: 0; border-radius: 18px 18px 0 0; box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.35); display: flex; flex-direction: column; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
#panel header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px var(--gutter-r) 6px var(--gutter-l); }
#panel header h2 { margin: 0; font-size: 18px; }
#panel-close { width: 32px; height: 32px; border-radius: 10px; border: 1px solid var(--line); background: transparent; font-size: 15px; }
#panel-body { overflow-y: auto; padding: 0 var(--gutter-r) 14px var(--gutter-l); min-width: 0; }
.sub { color: var(--muted); margin: 4px 0 8px; font-size: 13px; line-height: 1.4; }
.sub.small { font-size: 12px; }
.row { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.row b { font-variant-numeric: tabular-nums; text-align: right; }
.row.big { font-size: 15px; padding: 7px 0; }
.meter { display: block; height: 6px; background: rgba(255, 255, 255, 0.08); border-radius: 3px; margin: 4px 0 8px; overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 3px; transition: width 0.4s; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
.badges span { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); }
.badges .ok { color: var(--good); } .badges .no { color: var(--bad); border-color: var(--bad); }
ul.factors, ul.checks { list-style: none; padding: 0; margin: 0; }
ul.factors li { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
ul.checks li { padding: 4px 0; font-size: 13px; }
ul.checks li.no { color: var(--fg); } ul.checks li.ok { color: var(--muted); }
.actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.actions.col { flex-direction: column; }
.actions.col .btn { width: 100%; }
.btn { border: 0; border-radius: 11px; background: var(--accent); color: var(--accent-ink); font-weight: 800; padding: 10px 14px; font-size: 14px; flex: 1 1 auto; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn.danger { background: var(--bad); color: #2b0606; }
.btn.small { padding: 6px 10px; font-size: 12px; flex: 0 0 auto; }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn:focus-visible, .tool:focus-visible, .choice:focus-visible, .style-card:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
input[type=range] { width: 100%; accent-color: var(--accent); margin: 4px 0; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 8px 0; }
.field input, .field select, textarea { font: inherit; font-size: 14px; color: var(--fg); background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; text-transform: none; letter-spacing: 0; width: 100%; }
textarea { width: 100%; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; margin: 6px 0; }
.switch { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 14px; }
.switch input { width: 20px; height: 20px; accent-color: var(--accent); }
.choices { display: flex; flex-wrap: wrap; gap: 6px; }
.choice { border: 1px solid var(--line); background: rgba(255, 255, 255, 0.04); border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 700; }
.choice.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.styles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.style-card { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.04); }
.style-card.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.style-card .sw { display: flex; gap: 3px; }
.style-card .sw i { width: 18px; height: 18px; border-radius: 5px; display: block; border: 1px solid rgba(0, 0, 0, 0.3); }
.style-card b { font-family: var(--font-display); font-weight: 600; font-size: 15px; }
.style-card small { color: var(--muted); line-height: 1.3; }
.spark { width: 100%; height: 44px; display: block; margin: 4px 0; }

/* ---------- explorar ---------- */
#explore { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
#explore > * { pointer-events: auto; }
.explore-top { position: absolute; top: calc(92px + env(safe-area-inset-top, 0px)); right: var(--gutter-r); display: flex; gap: 6px; align-items: center; }
.explore-top .btn { background: var(--glass-2); color: var(--fg); border: 1px solid var(--line); }
#joy { position: absolute; left: calc(var(--gutter-l) + 10px); bottom: calc(28px + env(safe-area-inset-bottom, 0px)); width: 124px; height: 124px; border-radius: 50%; background: rgba(14, 19, 30, 0.55); border: 1px solid var(--line); touch-action: none; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
#joy-knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: var(--accent); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4); pointer-events: none; }
.explore-hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); margin: 0; font-size: 12px; color: var(--fg); background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
body.explore #toolbar, body.explore #hint, body.explore #panel, body.explore #confirm { display: none !important; }
@media (min-width: 900px) { #joy { display: none; } .explore-hint { bottom: 16px; } }

/* ---------- modal ---------- */
#modal { position: fixed; inset: 0; z-index: 20; background: rgba(4, 7, 12, 0.6); display: flex; align-items: center; justify-content: center; padding: 16px var(--gutter-r) 16px var(--gutter-l); }
.modal-card { width: 100%; max-width: 440px; max-height: 90%; overflow-y: auto; background: var(--glass-2); border: 1px solid var(--line); border-radius: 18px; padding: 18px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.modal-card h2 { margin: 0 0 8px; font-size: 22px; }
.modal-card p { line-height: 1.45; margin: 6px 0; }
.dots { display: flex; gap: 6px; margin: 10px 0 4px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); display: block; }
.dots i.on { background: var(--accent); }
.fatal { position: fixed; inset: auto 16px 50% 16px; background: var(--glass-2); border: 1px solid var(--bad); border-radius: 14px; padding: 16px; text-align: center; z-index: 30; }

@media (min-width: 900px) {
  #panel { left: auto; right: 12px; bottom: 170px; top: calc(96px + env(safe-area-inset-top, 0px)); width: 360px; max-height: none; border-radius: 16px; border-bottom: 1px solid var(--line); z-index: 7; }
  .hint, #confirm { bottom: 170px; }
  #panel header { padding: 12px 14px 6px; }
  #panel-body { padding: 0 14px 14px; }
  .city-name b { max-width: 260px; }
}
@media (max-width: 480px) {
  .chip { padding: 4px 8px; font-size: 12.5px; }
  .chip small { font-size: 10.5px; }
  #balance { display: none; }
  .city-name { padding: 3px 8px; }
  .city-name b { font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  .toast { animation: none; } .meter i, .rci .bar i { transition: none; }
}

.switch.law { align-items: flex-start; padding: 6px 0; border-bottom: 1px solid var(--line); }
.switch.law small { color: var(--muted); font-size: 11.5px; }

/* ---------- tela de entrada ---------- */
#intro { position: fixed; inset: 0; z-index: 15; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: max(28px, env(safe-area-inset-top)) 16px max(22px, env(safe-area-inset-bottom));
  background: linear-gradient(to bottom, rgba(9, 14, 26, 0.8) 0%, rgba(9, 14, 26, 0.2) 32%, rgba(9, 14, 26, 0.08) 52%, rgba(9, 14, 26, 0.75) 78%, rgba(9, 14, 26, 0.92) 100%); transition: opacity 0.6s ease; }
#intro[hidden] { display: none; }
#intro.out { opacity: 0; pointer-events: none; }

        if (x < W - 1 && copy[i + 1] === T.WATER) nearWater = true;

        if (z < H - 1 && copy[i + W] === T.WATER) nearWater = true;
        if (nearWater) { t[i] = T.SAND; h[i] = 0; }
      }
      this.recomputeWaterDist();
    }

    recomputeWaterDist() {
      const d = this.waterDist; d.fill(255);
      const q = [];
      for (let i = 0; i < N; i++) if (this.terrain[i] === T.WATER) { d[i] = 0; q.push(i); }
      let qi = 0;
      while (qi < q.length) {
        const i = q[qi++]; const x = i % W, z = (i / W) | 0; const nd = d[i] + 1;
        if (nd > 8) continue;
        for (const [nx, nz] of [[x - 1, z], [x + 1, z], [x, z - 1], [x, z + 1]]) {
          if (!this.inb(nx, nz)) continue;
          const j = nz * W + nx;
          if (d[j] > nd) { d[j] = nd; q.push(j); }
        }
      }
    }

    clearForest(i) {
      if (this.terrain[i] === T.FOREST) { this.terrain[i] = T.GRASS; this.dirty.trees = true; this.dirty.terrain = true; }
    }

    /* --- consultas --- */
    // ampliação de um complexo: pode ficar sem rua se encostar, alinhada, em outra construção igual
    sameKindBeside(kind, x, z, size) {
      if (!COMBO[kind]) return false;
      for (const [dx, dz] of [[size, 0], [-size, 0], [0, size], [0, -size]]) { const nx = x + dx, nz = z + dz; if (!this.inb(nx, nz)) continue; const m = this.bmap.get(this.bld[this.idx(nx, nz)]); if (m && m.kind === kind && m.x === nx && m.z === nz) return true; }
      return false;
    }
    hasRoadAround(x, z, size) {
      for (let dz = -1; dz <= size; dz++) for (let dx = -1; dx <= size; dx++) {
        const corner = (dx === -1 || dx === size) && (dz === -1 || dz === size);
        if (corner) continue;
        const inside = dx >= 0 && dx < size && dz >= 0 && dz < size;
        if (inside) continue;
        const nx = x + dx, nz = z + dz;
        if (this.inb(nx, nz) && this.road[this.idx(nx, nz)]) return true;
      }
      return false;
    }
    hasWaterAround(x, z, size) {
      for (let dz = -1; dz <= size; dz++) for (let dx = -1; dx <= size; dx++) {
        const inside = dx >= 0 && dx < size && dz >= 0 && dz < size; if (inside) continue;
        const nx = x + dx, nz = z + dz;
        if (this.inb(nx, nz) && this.terrain[this.idx(nx, nz)] === T.WATER) return true;
      }
      return false;
    }
    roadSide(x, z) {
      const r = (dx, dz) => this.inb(x + dx, z + dz) && this.road[this.idx(x + dx, z + dz)];
      if (r(0, 1)) return 0; if (r(1, 0)) return 1; if (r(0, -1)) return 2; if (r(-1, 0)) return 3;
      return 0;
    }

    recomputeRoadNear() {
      const rn = this.roadNear, nr = this.nearestRoad; rn.fill(0); nr.fill(-1);
      const best = new Uint8Array(N).fill(255);
      let roads = 0, avenues = 0, bridges = 0;
      for (let z = 0; z < H; z++) for (let x = 0; x < W; x++) {
        const i = z * W + x; if (!this.road[i]) continue;
        if (this.road[i] === 3) continue;
        roads++; if (this.road[i] === 2) avenues++; if (this.terrain[i] === T.WATER) bridges++;
        for (let dz = -2; dz <= 2; dz++) for (let dx = -2; dx <= 2; dx++) {
          const nx = x + dx, nz = z + dz;
          if (!this.inb(nx, nz)) continue;
          const j = nz * W + nx, dist = Math.abs(dx) + Math.abs(dz);
          rn[j] = 1;
          if (dist < best[j]) { best[j] = dist; nr[j] = i; }
        }
      }
      this.stats.roads = roads; this.stats.avenues = avenues; this.stats.bridges = bridges;
      this.roadNearDirty = false;
    }

    isUnlocked(kind) {
      const d = DEFS[kind] || HAND[kind];
      return !d || !d.unlock || this.maxPop >= d.unlock;
    }
    titleFor(pop) { let t = TITLES[0].title; for (const e of TITLES) if (pop >= e.pop) t = e.title; return t; }

    /* --- construção --- */
    placeRoad(x, z, type) {
      type = type || 1;
      if (!this.inb(x, z)) return { ok: false };
      const i = this.idx(x, z);
      if (!this.isOwned(x, z)) return { ok: false, reason: 'Compre este terreno primeiro (categoria Terreno).' };
      if (this.road[i] === type) return { ok: true, nothing: true };
      if (this.road[i] === 3 || type === 3) return { ok: false, reason: 'A rodovia é do estado: ligue suas ruas nela.' };
      if (this.bld[i] >= 0) return { ok: false, reason: 'Demolir o prédio primeiro.' };
      const bridge = this.terrain[i] === T.WATER;
      const cost = this.road[i] ? Math.max(0, (bridge ? ROADS[type].bridge : ROADS[type].cost) - (bridge ? ROADS[this.road[i]].bridge : ROADS[this.road[i]].cost)) : (bridge ? ROADS[type].bridge : ROADS[type].cost);
      if (this.money < cost) return { ok: false, reason: 'Dinheiro insuficiente.' };
      this.money -= cost;
      this.road[i] = type;
      if (this.zone[i]) { this.zone[i] = 0; this.dirty.zones = true; }
      this.clearForest(i);
      this.markRoad(x, z);
      return { ok: true, bridge };
    }

    // guarda o traçado de uma rua desenhada em curva (ou reta inclinada) nas quadras que ela ocupa
    // rec: { ax, az, bx, bz, shape: 'curve' | 'diag', sx: sai de A no sentido x }
    markCurve(tiles, rec) {
      const id = this.nextCurve++; if (this.nextCurve > 65000) this.nextCurve = 1;
      this.curves.set(id, { ax: rec.ax, az: rec.az, bx: rec.bx, bz: rec.bz, shape: rec.shape === 'diag' ? 'diag' : 'curve', sx: rec.sx !== false });
      for (const t of tiles) { if (!this.inb(t.x, t.z)) continue; const i = this.idx(t.x, t.z); if (this.road[i] && this.road[i] !== 3) { this.curveOf[i] = id; this.markRoad(t.x, t.z); } }
      return id;
    }

    setZone(x, z, zk) {
      if (!this.inb(x, z)) return { ok: false };
      const i = this.idx(x, z);
      const zv = Z[zk];
      if (!this.isOwned(x, z)) return { ok: false, reason: 'Compre este terreno primeiro (categoria Terreno).' };
      if (this.zone[i] === zv) return { ok: true, nothing: true };
      if (this.terrain[i] === T.WATER) return { ok: false, reason: 'Não dá para zonear a água.' };
      if (this.road[i]) return { ok: false, reason: 'Aqui tem rua.' };
      if (this.bld[i] >= 0) return { ok: false, reason: 'Demolir o prédio primeiro.' };
      if (this.money < 4) return { ok: false, reason: 'Dinheiro insuficiente.' };
      this.money -= 4;
      this.zone[i] = zv;
      this.clearForest(i);
      this.dirty.zones = true;
      return { ok: true };
    }

    bulldoze(x, z) {
      if (!this.inb(x, z)) return { ok: false };
      const i = this.idx(x, z);
      if (this.bld[i] >= 0) {
        const b = this.bmap.get(this.bld[i]);
        const cost = DEFS.bulldoze.cost * (FW(b) * FD(b));
        if (this.money < cost) return { ok: false, reason: 'Dinheiro insuficiente.' };
        this.money -= cost;
        this.removeBuilding(b);
        return { ok: true, what: 'building' };
      }
      if (this.road[i]) {
        if (this.road[i] === 3) return { ok: false, reason: 'A rodovia é do estado: não pode ser demolida.' };
        if (this.money < DEFS.bulldoze.cost) return { ok: false, reason: 'Dinheiro insuficiente.' };
        this.money -= DEFS.bulldoze.cost;
        this.road[i] = 0; this.curveOf[i] = 0; this.markRoad(x, z); this.dirty.buildings = true;
        return { ok: true, what: 'road' };
      }
      if (this.zone[i]) { this.zone[i] = 0; this.dirty.zones = true; return { ok: true, what: 'zone' }; }
      if (this.terrain[i] === T.FOREST) {
        if (this.money < DEFS.bulldoze.cost) return { ok: false, reason: 'Dinheiro insuficiente.' };
        this.money -= DEFS.bulldoze.cost; this.clearForest(i);
        return { ok: true, what: 'forest' };
      }
      return { ok: true, nothing: true };
    }

    // prédios de serviço, decorações e prédios colocados à mão
    canPlace(kind, x, z) {
      const d = DEFS[kind], hd = HAND[kind];
      if (!d && !hd) return { ok: false };
      const size = d ? d.size : 1, cost = d ? d.cost : hd.cost;
      if (!this.isUnlocked(kind)) return { ok: false, reason: `Libera com ${(d || hd).unlock} habitantes.` };
      if (hd && this.stats.education < ZSTAT[hd.z].eduNeed[hd.level - 1]) return { ok: false, reason: `Precisa de ${Math.round(ZSTAT[hd.z].eduNeed[hd.level - 1] * 100)}% de educação (escolas e universidade).` };
      let h0 = null;
      for (let dz = 0; dz < size; dz++) for (let dx = 0; dx < size; dx++) {
        const nx = x + dx, nz = z + dz;
        if (!this.inb(nx, nz)) return { ok: false, reason: 'Fora do mapa.' };
        if (!this.isOwned(nx, nz)) return { ok: false, reason: 'Compre este terreno primeiro (categoria Terreno).' };
        const i = this.idx(nx, nz);
        if (this.terrain[i] === T.WATER) return { ok: false, reason: 'Não dá para construir na água.' };
        if (this.road[i]) return { ok: false, reason: 'Aqui tem rua.' };
        if (this.bld[i] >= 0) return { ok: false, reason: 'Local ocupado.' };
        if (h0 === null) h0 = this.height[i]; else if (this.height[i] !== h0) return { ok: false, reason: 'O terreno precisa ser plano (use Elevar/Rebaixar).' };
      }
      if (d && d.needRoad && !this.hasRoadAround(x, z, size) && !this.sameKindBeside(kind, x, z, size)) return { ok: false, reason: 'Precisa ficar ao lado de uma rua.' };
      if (d && d.needWater && !this.hasWaterAround(x, z, size)) return { ok: false, reason: 'Precisa encostar na água.' };
      if (d && d.max && this.buildings.filter(b => b.kind === kind).length >= d.max) return { ok: false, reason: d.max === 1 ? `A cidade só comporta um ${d.name.toLowerCase()}.` : `Limite de ${d.max} por cidade.` };
      if (this.money < cost) return { ok: false, reason: 'Dinheiro insuficiente.' };
      return { ok: true };
    }

    place(kind, x, z, rot) {
      const c = this.canPlace(kind, x, z); if (!c.ok) return c;
      const d = DEFS[kind], hd = HAND[kind];
      this.money -= d ? d.cost : hd.cost;
      const i = this.idx(x, z);
      let b;
      if (hd) {
        b = this.newBuilding(hd.z, x, z, 1, hd.level, true);
        b.rot = rot === undefined ? this.roadSide(x, z) : rot;
        b.occ = 0.0; b.cons = 1;
        this.counters.hand++;
        this.addBuilding(b);
        this.zone[i] = Z[hd.z]; this.dirty.zones = true;
      } else {
        b = this.newBuilding(kind, x, z, d.size, 1, false);
        b.rot = rot || 0; b.occ = 1; b.happy = 100; b.cons = d.deco ? 0 : 1;
        this.addBuilding(b);
        this.dirty.coverage = true;
        this.recomputeCoverage();
      }
      b.h = this.height[i];
      this.spawnQueue.push({ x, z, kind: b.kind, size: b.size });
      return { ok: true, building: b };
    }

    newBuilding(kind, x, z, size, level, hand) {
      return { id: this.nextId++, kind, x, z, size, level, occ: 0.25, happy: 55, age: 0, abandoned: false, badMonths: 0, seed: (Math.random() * 1e9) >>> 0, rot: 0, h: this.height[this.idx(x, z)], burning: false, fireMonths: 0, hand: !!hand, crime: 0, powered: true, watered: true, cons: 0, topIssue: null, truckArrived: false };
    }

    /* --- ampliações (complexos) --- */
    // grupo de construções iguais ligadas a b (mesmo tipo, alinhadas, prontas e no mesmo patamar); extra = construção ainda não feita (prévia)
    comboComp(b, extra) {
      const S = b.size || 1, h0 = b.h || 0;
      const at = (x, z) => { if (extra && extra.x === x && extra.z === z) return extra; if (!this.inb(x, z)) return null; const m = this.bmap.get(this.bld[this.idx(x, z)]); return m && m.kind === b.kind && m.x === x && m.z === z && !(m.cons > 0) && (m.h || 0) === h0 ? m : null; };
      const comp = [b], seen = new Set([b]);
      for (let i = 0; i < comp.length && comp.length < 240; i++) { const c = comp[i]; for (const [dx, dz] of [[S, 0], [-S, 0], [0, S], [0, -S]]) { const m = at(c.x + dx, c.z + dz); if (m && !seen.has(m)) { seen.add(m); comp.push(m); } } }
      return { comp, at, seen };
    }
    // divide o grupo em retângulos (de cima para baixo, da esquerda para a direita); cada retângulo é um complexo
    comboRects(b, extra) {
      const lim = COMBO[b.kind], S = b.size || 1, { comp, at, seen } = this.comboComp(b, extra);
      comp.sort((p, q) => p.z - q.z || p.x - q.x);
      const used = new Set(), out = [];
      for (const L of comp) {
        if (used.has(L)) continue;
        let w = 1; while (w < lim[0]) { const m = at(L.x + w * S, L.z); if (!m || used.has(m) || !seen.has(m)) break; w++; }
        let d = 1; while (d < lim[1]) { let ok = true; for (let k = 0; k < w; k++) { const m = at(L.x + k * S, L.z + d * S); if (!m || used.has(m) || !seen.has(m)) { ok = false; break; } } if (!ok) break; d++; }
        const mem = []; for (let j = 0; j < d; j++) for (let k = 0; k < w; k++) { const m = at(L.x + k * S, L.z + j * S); mem.push(m); used.add(m); }
        out.push({ leader: L, kind: b.kind, w: w * S, d: d * S, nx: w, nz: d, n: mem.length, mem, cx: L.x + w * S / 2, cz: L.z + d * S / 2, sig: L.id + ':' + w + 'x' + d });
      }
      return out;
    }
    groups() {
      if (this._groups && !this._grpDirty) return this._groups;
      const map = new Map(), seen = new Set();
      for (const b of this.buildings) {
        if (!COMBO[b.kind] || b.cons > 0 || seen.has(b.id)) continue;
        for (const g of this.comboRects(b)) { for (const m of g.mem) seen.add(m.id); if (g.n > 1) for (const m of g.mem) map.set(m.id, g); }
      }
      this._groups = map; this._grpDirty = false; return map;
    }
    groupOf(b) { return b && COMBO[b.kind] ? this.groups().get(b.id) || null : null; }
    // prévia: o complexo que se formaria construindo kind em (x, z)
    groupPreview(kind, x, z) {
      const d = DEFS[kind]; if (!COMBO[kind] || !d || !this.inb(x, z)) return null;
      const v = { id: -1, kind, x, z, size: d.size, h: this.height[this.idx(x, z)], cons: 0 };
      const g = this.comboRects(v, v).find(r => r.mem.includes(v));
      return g && g.n > 1 ? g : null;
    }

    addBuilding(b) {
      this._grpDirty = true;
      this.buildings.push(b); this.bmap.set(b.id, b);
      for (let dz = 0; dz < FD(b); dz++) for (let dx = 0; dx < FW(b); dx++) {
        const i = this.idx(b.x + dx, b.z + dz);
        this.bld[i] = b.id;
        if (this.zone[i] && DEFS[b.kind]) { this.zone[i] = 0; this.dirty.zones = true; }
        this.clearForest(i);
      }
      this.markChunk(b.x, b.z); this.markChunk(b.x + FW(b) - 1, b.z + FD(b) - 1);
      this.dirty.buildings = true;
      if (DEFS[b.kind] && DEFS[b.kind].cov === 'park') this.dirty.trees = true;
    }

    removeBuilding(b) {
      this._grpDirty = true;
      for (let dz = 0; dz < FD(b); dz++) for (let dx = 0; dx < FW(b); dx++) this.bld[this.idx(b.x + dx, b.z + dz)] = -1;
      const k = this.buildings.indexOf(b);
      if (k >= 0) this.buildings.splice(k, 1);
      this.bmap.delete(b.id);
      this.markChunk(b.x, b.z); this.markChunk(b.x + FW(b) - 1, b.z + FD(b) - 1);
      this.dirty.buildings = true;
      if (DEFS[b.kind]) { this.dirty.coverage = true; this.recomputeCoverage(); if (DEFS[b.kind].cov === 'park') this.dirty.trees = true; }
      if (b.hand) this.dirty.zones = true;
    }

    /* --- terraformação --- */
    terraform(op, x, z) {
      if (!this.inb(x, z)) return { ok: false };
      const i = this.idx(x, z), d = TERRA[op]; if (!d) return { ok: false };
      if (!this.isOwned(x, z)) return { ok: false, reason: 'Compre este terreno primeiro (categoria Terreno).' };
      const water = this.terrain[i] === T.WATER;
      const busy = this.bld[i] >= 0 || this.road[i];
      if (op === 'fill') {
        if (!water) return { ok: true, nothing: true };
        if (this.road[i]) return { ok: false, reason: 'Demolir a ponte primeiro.' };
      } else if (water) return { ok: false, reason: op === 'dig' ? 'Já é água.' : 'Aterre a água primeiro.' };
      if (op === 'grass' && this.terrain[i] === T.GRASS) return { ok: true, nothing: true };
      if (op === 'sand' && this.terrain[i] === T.SAND) return { ok: true, nothing: true };
      if (op === 'trees' && this.terrain[i] === T.FOREST) return { ok: true, nothing: true };
      if ((op === 'grass' || op === 'sand' || op === 'trees') && this.road[i]) return { ok: false, reason: 'Aqui tem rua.' };
      if ((op === 'trees') && this.bld[i] >= 0) return { ok: false, reason: 'Local ocupado.' };
      if ((op === 'raise' || op === 'lower' || op === 'dig') && (busy || this.zone[i])) return { ok: false, reason: 'Só em terreno vazio (sem rua, zona ou prédio).' };
      if (op === 'raise' && this.height[i] >= 2) return { ok: true, nothing: true };
      if (op === 'lower' && this.height[i] <= 0) return { ok: true, nothing: true };
      if (op === 'dig' && this.height[i] > 0) return { ok: false, reason: 'Só dá para cavar no nível mais baixo.' };
      if (this.money < d.cost) return { ok: false, reason: 'Dinheiro insuficiente.' };
      this.money -= d.cost;
      if (op === 'grass') this.terrain[i] = T.GRASS;
      else if (op === 'sand') this.terrain[i] = T.SAND;
      else if (op === 'trees') { this.terrain[i] = T.FOREST; if (this.zone[i]) { this.zone[i] = 0; this.dirty.zones = true; } }
      else if (op === 'raise') this.height[i]++;
      else if (op === 'lower') this.height[i]--;
      else if (op === 'dig') { this.terrain[i] = T.WATER; this.height[i] = 0; this.recomputeWaterDist(); }
      else if (op === 'fill') { this.terrain[i] = T.SAND; this.height[i] = 0; this.recomputeWaterDist(); }
      this.dirty.terrain = true; this.dirty.trees = true; this.dirty.fog = true; this.dirty.zones = true; this.dirty.overlay = true;
      this.markRoad(x, z);
      return { ok: true };
    }

    /* --- cobertura de serviços / energia / água --- */
    recomputeCoverage() {
      for (const k in this.cov) this.cov[k].fill(0);
      this.powerCov.fill(0); this.waterCov.fill(0);
      const groups = this.groups(), done = new Set();
      for (const b of this.buildings) {
        const d = DEFS[b.kind]; if (!d || !d.size || b.cons > 0) continue;
        const g = groups.get(b.id); if (g) { if (done.has(g)) continue; done.add(g); }
        const bo = g ? comboBonus(g.n) : null, core = bo ? bo.core : 0.6;
        const cx = g ? g.cx : b.x + b.size / 2, cz = g ? g.cz : b.z + b.size / 2, R = d.radius * (bo ? bo.R : 1);
        const map = d.cov ? this.cov[d.cov] : (d.power ? this.powerCov : d.water ? this.waterCov : null);
        if (!map) continue;
        const w = Math.min(1, (d.covW || 1) * (bo ? bo.w : 1));
        const x0 = Math.max(0, Math.floor(cx - R)), x1 = Math.min(W - 1, Math.ceil(cx + R));
        const z0 = Math.max(0, Math.floor(cz - R)), z1 = Math.min(H - 1, Math.ceil(cz + R));
        for (let z = z0; z <= z1; z++) for (let x = x0; x <= x1; x++) {
          const dx = x + 0.5 - cx, dz = z + 0.5 - cz; const dist = Math.sqrt(dx * dx + dz * dz);
          if (dist > R) continue;
          const i = z * W + x;
          if (d.cov) { const v = (dist <= core * R ? 1 : 1 - (dist - core * R) / ((1 - core) * R + 1)) * w; if (v > map[i]) map[i] = v; }
          else map[i] = 1;
        }
      }
      this.dirty.coverage = false;
      this.dirty.overlay = true;
    }

    recomputePollution() {
      const p = this.pollution; p.fill(0);
      const emit = (cx, cz, e, R) => {
        const x0 = Math.max(0, Math.floor(cx - R)), x1 = Math.min(W - 1, Math.ceil(cx + R));
        const z0 = Math.max(0, Math.floor(cz - R)), z1 = Math.min(H - 1, Math.ceil(cz + R));
        for (let z = z0; z <= z1; z++) for (let x = x0; x <= x1; x++) {
          const dx = x + 0.5 - cx, dz = z + 0.5 - cz; const dist = Math.sqrt(dx * dx + dz * dz);
          if (dist > R) continue;
          p[z * W + x] += e * (1 - dist / (R + 0.5));
        }
      };
      this.indNear.fill(0);
      for (const b of this.buildings) {
        if (b.kind === 'I' && !b.abandoned) {
          emit(b.x + 0.5, b.z + 0.5, [0.45, 0.75, 0.3][b.level - 1] * (0.3 + 0.7 * b.occ), 3 + b.level);
          for (let dz = -2; dz <= 2; dz++) for (let dx = -2; dx <= 2; dx++) {
            const nx = b.x + dx, nz = b.z + dz; if (this.inb(nx, nz)) this.indNear[nz * W + nx] = 1;
          }
        } else if (b.burning) {
          emit(b.x + 0.5, b.z + 0.5, 0.6, 3);
        } else {
          const d = DEFS[b.kind];

    }

    recomputeLandValue() {
      const lv = this.landValue;
      for (let i = 0; i < N; i++) {
        if (this.terrain[i] === T.WATER) { lv[i] = 0; continue; }
        let v = 0.25;

    }

    computeUtilities() {

        const d = DEFS[b.kind]; if (b.cons > 0) continue;

    /* --- trânsito --- */
    bfsToJob(from, jobTile) {
      const prev = this.bfsPrev || (this.bfsPrev = new Int32Array(N));
      prev.fill(-2); prev[from] = -1;
      const q = [from]; let qi = 0, found = -1, visits = 0;
      while (qi < q.length && visits < 6000) {
        const i = q[qi++]; visits++;

        for (const j of nb) { if (j < 0 || prev[j] !== -2 || !this.roadConn(i, j)) continue; prev[j] = i; q.push(j); }

    computeTraffic() {
      if (this.roadNearDirty) this.recomputeRoadNear();
      const load = this.trafficLoad || (this.trafficLoad = new Float32Array(N)); load.fill(0);
      const jobTile = this.jobTile || (this.jobTile = new Uint8Array(N)); jobTile.fill(0);
      for (const b of this.buildings) {
        if ((b.kind !== 'C' && b.kind !== 'I') || b.abandoned || b.burning) continue;
        for (let dz = -1; dz <= FD(b); dz++) for (let dx = -1; dx <= FW(b); dx++) {
          const nx = b.x + dx, nz = b.z + dz; if (!this.inb(nx, nz)) continue;
          const j = this.idx(nx, nz); if (this.road[j]) jobTile[j] = 1;
        }

      const cache = new Map();
      for (const b of this.buildings) {
        if (b.kind !== 'R' || b.abandoned || b.burning) continue;
        const i = this.idx(b.x, b.z), o = this.nearestRoad[i]; if (o < 0) continue;
        let path = cache.get(o);
        if (path === undefined) { path = this.bfsToJob(o, jobTile); cache.set(o, path); }
        if (!path) continue;
        const workers = ZSTAT.R.cap[b.level - 1] * AM(b) * b.occ * 0.5;
        const reduce = clamp(1 - 0.45 * this.cov.bus[i] - 0.7 * this.cov.metro[i], 0.2, 1);

      const tr = this.traffic, tn = this.trafficNear; tn.fill(0);
      for (let i = 0; i < N; i++) {
        if (!this.road[i]) { tr[i] = 0; continue; }
        roads++;
        tr[i] = load[i] / ROADS[this.road[i]].cap;
        if (tr[i] > 1) congested++;
        const c = clamp(tr[i] - 1, 0, 1); if (c <= 0) continue;
        const x = i % W, z = (i / W) | 0;
        for (let dz = -2; dz <= 2; dz++) for (let dx = -2; dx <= 2; dx++) {
          const nx = x + dx, nz = z + dz; if (!this.inb(nx, nz)) continue;

    }

    /* --- felicidade --- */
    happinessFactors(b) {
      const i = this.idx(b.x, b.z), s = this.stats, eff = this.money < 0 ? 0.5 : 1;
      const pol = this.pollution[i], lv = this.landValue[i], traf = this.trafficNear[i], crime = b.crime || 0;
      const cv = k => this.cov[k][i] * eff;
      const list = []; let total = 50;
      const add = (label, v) => { v = Math.round(v); if (v !== 0) { list.push({ label, v }); total += v; } };
      const taxF = -(this.tax - 9) * 1.5;
      const garbage = -clamp((s.pop - 300) / 700, 0, 1) * (1 - cv('garbage'));
      if (b.kind === 'R') {
        add('Polícia', cv('police') * 12); add('Bombeiros', cv('fire') * 8); add('Escola', cv('school') * 14); add('Hospital', cv('hospital') * 14);
        add('Universidade', cv('university') * 6); add('Parques', cv('park') * 12); add('Estádio', cv('stadium') * 8); add('Ônibus', cv('bus') * 3); add('Metrô', cv('metro') * 6);
        add('Poluição', -pol * 35); add('Impostos', taxF); add('Desemprego', -s.unemp * 20); add('Trânsito', -traf * 16); add('Criminalidade', -crime * 12); add('Lixo', garbage * 10);
        if (this.waterDist[i] <= 2) add('Vista para a água', 5);
        if (this.policies.green) add('Bairros verdes', 4);
        for (const a of this.buildings) if (a.kind === 'airport' && !(a.cons > 0)) { const d = Math.hypot(b.x - (a.x + 2), b.z - (a.z + 2)); if (d < 9) add('Barulho do aeroporto', -Math.min(12, (9 - d) * 2)); }
        if (b.level === 3) add('Adensamento', -3);
      } else if (b.kind === 'C') {
        add('Polícia', cv('police') * 10); add('Bombeiros', cv('fire') * 8); add('Clientes', s.customers * 15); add('Valor do terreno', lv * 15);
        add('Parques', cv('park') * 5); add('Estacionamento', cv('parking') * 6); add('Estádio', cv('stadium') * 5); add('Metrô', cv('metro') * 4);
        add('Poluição', -pol * 10); add('Impostos', taxF); add('Trânsito', -traf * 10); add('Criminalidade', -crime * 10); add('Lixo', garbage * 8);
      } else {
        add('Bombeiros', cv('fire') * 12); add('Polícia', cv('police') * 5); add('Mão de obra', s.labor * 15); add('Impostos', taxF); add('Trânsito', -traf * 6);
      }

      if (!b.powered) add('Sem energia', -30);
      if (!b.watered) add('Sem água', b.kind === 'R' ? -20 : -15);
      if (b.burning) add('Em chamas', -50);

    }

    /* --- crescimento --- */
    growthPass() {
      if (this.roadNearDirty) this.recomputeRoadNear();
      const s = this.stats;
      if (s.powerShort || s.waterShort) return;
      const rnd = Math.random;
      for (let i = 0; i < N; i++) {
        const zv = this.zone[i]; if (!zv || this.bld[i] >= 0) continue;
        if (!this.roadNear[i] || !this.powerCov[i] || !this.waterCov[i]) continue;
        const kind = ZK[zv]; const dmd = this.demand[kind];
        if (dmd <= 0.03) continue;
        if (rnd() < GROWTH_P * dmd) this.spawnZoneBuilding(kind, i % W, (i / W) | 0);
      }
    }

    spawnZoneBuilding(kind, x, z) {
      const b = this.newBuilding(kind, x, z, 1, 1, false);
      b.rot = this.roadSide(x, z); b.occ = 0; b.cons = 2;
      this.addBuilding(b);
      this.spawnQueue.push({ x, z, kind, size: 1, first: !this.flags.firstBuilding && kind === 'R' });
      if (!this.flags.firstBuilding && kind === 'R') { this.flags.firstBuilding = true; this.event('A primeira família chegou pela rodovia e começou a construir! 🚚', 'good', x, z); }
      return b;
    }

    updateBuildings() {
      const s = this.stats;
      // --- adensamento realista: primeiro a cidade ocupa os lotes com casas; só quando falta lote e sobra procura é que
      //     aparecem prédios médios, e torres só em cidade grande, no meio de bairros já densos ---
      const dn = { R: { n: [0, 0, 0], free: 0 }, C: { n: [0, 0, 0], free: 0 }, I: { n: [0, 0, 0], free: 0 } };
      for (const b of this.buildings) if (dn[b.kind]) dn[b.kind].n[b.level - 1]++;
      for (let i = 0; i < this.N; i++) { const zv = this.zone[i]; if (zv && this.bld[i] < 0 && this.roadNear[i] && this.powerCov[i] && this.waterCov[i]) dn[zv === Z.R ? 'R' : zv === Z.C ? 'C' : 'I'].free++; }
      let upLeft = (this.month % 3 === 0 ? 1 : 0) + Math.floor(s.pop / 5000);
      const mayEvolve = b => {
        const d = dn[b.kind], tot = d.n[0] + d.n[1] + d.n[2], to = b.level + 1;
        if (upLeft <= 0 || tot < 6) return false;
        if (s.pop < (to === 2 ? 450 : 2600)) return false;                               // porte da cidade
        if (this.demand[b.kind] < (to === 2 ? 0.2 : 0.28)) return false;                  // procura forte de verdade
        if (d.free > Math.max(1, tot * 0.06)) return false;                               // ainda há lote vazio: constrói casa antes
        const share = to === 2 ? clamp((s.pop - 450) / 5000, 0.06, 0.55) : clamp((s.pop - 2600) / 14000, 0.03, 0.28);
        if ((to === 2 ? d.n[1] + d.n[2] : d.n[2]) >= Math.ceil(tot * share)) return false; // pirâmide: poucas torres, alguns prédios, muitas casas
        if (to === 3) { let dense = 0; for (let dz = -2; dz <= FD(b) + 1; dz++) for (let dx = -2; dx <= FW(b) + 1; dx++) { const x = b.x + dx, z = b.z + dz; if (!this.inb(x, z)) continue; const o = this.bmap.get(this.bld[this.idx(x, z)]); if (o && o !== b && o.level >= 2 && ZSTAT[o.kind]) dense++; } if (dense < 3) return false; }   // torre nasce em bairro já adensado
        return true;
      };
      const popF = clamp(s.pop / 600, 0.3, 1);
      for (const b of this.buildings.slice()) {
        if (this.bmap.get(b.id) !== b) continue;   // engolido por um vizinho que cresceu
        if (b.cons > 0) {
          b.cons--;
          if (b.cons === 0) {
            if (COMBO[b.kind]) this._grpDirty = true;
            this.markChunk(b.x, b.z); this.markChunk(b.x + FW(b) - 1, b.z + FD(b) - 1);
            this.dirty.buildings = true; this.completedQueue.push({ x: b.x, z: b.z, kind: b.kind, size: b.size, level: b.level });
            if (DEFS[b.kind]) { this.dirty.coverage = true; }
            if (ZSTAT[b.kind] && b.occ < 0.2) b.occ = 0.2;
          }

        }
        const zs = ZSTAT[b.kind]; if (!zs) continue;
        b.age++;
        const i = this.idx(b.x, b.z);
        b.crime = clamp((1 - this.cov.police[i] * (this.money < 0 ? 0.5 : 1)) * (0.2 + 0.2 * b.level) * popF * (this.policies.patrol ? 0.65 : 1), 0, 1);
        this.crimeMap[i] = b.crime;
        const hf = this.happinessFactors(b);
        b.happy = hf.total;
        let worst = null; for (const f of hf.list) if (f.v <= -8 && (!worst || f.v < worst.v)) worst = f;
        b.topIssue = worst ? worst.label : null;
        let target = clamp(0.45 + 0.45 * this.demand[b.kind] + (b.happy - 50) / 150, 0.05, 1);
        if (!b.powered || !b.watered) target = 0.12;
        if (b.abandoned || b.burning) target = 0.03;
        b.occ += (target - b.occ) * 0.2;
        if (b.happy < 25) b.badMonths++; else b.badMonths = Math.max(0, b.badMonths - 1);
        if (!b.abandoned && b.badMonths >= 6) {
          b.abandoned = true; b.occ = 0.03; this.markChunk(b.x, b.z); this.dirty.buildings = true;
          if (this.flags.abandonWarn <= 0) { this.flags.abandonWarn = 12; this.event(`Prédio abandonado: ${b.topIssue ? b.topIssue.toLowerCase() : 'moradores infelizes'}. ${b.topIssue && ISSUE_TIPS[b.topIssue] ? ISSUE_TIPS[b.topIssue] : 'Toque no prédio para ver os motivos.'}`, 'warn', b.x, b.z, this.flags.abandonTold ? 'log' : 'notice'); this.flags.abandonTold = true; }
        } else if (b.abandoned && b.happy >= 45) {
          b.abandoned = false; b.badMonths = 0; b.occ = 0.2; this.markChunk(b.x, b.z); this.dirty.buildings = true;
        } else if (b.abandoned && b.badMonths >= 9) {

          continue;
        }
        if (!b.abandoned && !b.burning && b.level < 3 && b.occ > 0.82 && b.happy > 60 && mayEvolve(b)) {
          const lv = this.landValue[i];
          if (lv >= zs.lvNeed[b.level] && s.education >= zs.eduNeed[b.level] && Math.random() < 0.05) {

            b.level++; b.cons = 2; this.markChunk(b.x, b.z); this.dirty.buildings = true;
            this.growLot(b);

            if (!this.flags.firstEvolve) { this.flags.firstEvolve = true; this.event(`${LEVEL_NAMES[b.kind][b.level - 2]} evoluindo para ${LEVEL_NAMES[b.kind][b.level - 1].toLowerCase()}: a cidade está prosperando! 🏗️`, 'good', b.x, b.z); }
          }
        }

    }

    // amplia o lote do prédio engolindo vizinhos menores da mesma zona: nível 2 ocupa até 2 quadras; nível 3, até 3 ou 4
    growLot(b) {
      const w = FW(b), d = FD(b), maxA = b.level >= 3 ? 4 : b.level === 2 ? 2 : 1; if (!ZSTAT[b.kind] || w * d >= maxA) return false;
      const opts = [];
      for (const [sx, sz, sw, sd, nw, nd, nx, nz] of [[b.x - 1, b.z, 1, d, w + 1, d, b.x - 1, b.z], [b.x + w, b.z, 1, d, w + 1, d, b.x, b.z], [b.x, b.z - 1, w, 1, w, d + 1, b.x, b.z - 1], [b.x, b.z + d, w, 1, w, d + 1, b.x, b.z]]) {
        if (nw * nd > maxA || Math.max(nw, nd) > 3) continue;
        let ok = true; const eat = [];
        for (let dz = 0; dz < sd && ok; dz++) for (let dx = 0; dx < sw && ok; dx++) {
          const xx = sx + dx, zz = sz + dz; if (!this.inb(xx, zz)) { ok = false; break; }
          const j = this.idx(xx, zz), o = this.bld[j] >= 0 ? this.bmap.get(this.bld[j]) : null;

      for (let dz = 0; dz < b.d; dz++) for (let dx = 0; dx < b.w; dx++) this.bld[this.idx(b.x + dx, b.z + dz)] = b.id;
      this.markChunk(b.x, b.z); this.markChunk(b.x + b.w - 1, b.z + b.d - 1); this.dirty.buildings = true;
      if (!this.flags.firstMerge) { this.flags.firstMerge = true; this.event('Um prédio cresceu e passou a ocupar o lote vizinho: bairros prósperos ganham construções maiores. 🏢', 'good', b.x, b.z); }
      return true;
    }

    /* --- incêndios --- */
    fireStep() {
      const list = this.buildings.filter(b => ZSTAT[b.kind]);
      const byTile = this.bld;
      for (const b of list) b.fireNear = false;
      let burning = 0;
      for (const b of list) {
        const i = this.idx(b.x, b.z), fc = this.cov.fire[i] * (this.money < 0 ? 0.5 : 1);
        if (b.burning) {
          burning++;
          b.fireMonths++;
          // vizinhos (só os colados, de lado) sofrem e, a partir do 2º mês, podem pegar fogo
          for (const [dx, dz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
            const nx = b.x + dx, nz = b.z + dz; if (!this.inb(nx, nz)) continue;
            const id = byTile[this.idx(nx, nz)]; if (id < 0) continue;
            const nb = this.bmap.get(id); if (!nb || !ZSTAT[nb.kind] || nb.burning || nb.abandoned || nb.cons > 0) continue;
            nb.fireNear = true;
            if (b.fireMonths >= 2 && Math.random() < 0.03 * (1 - this.cov.fire[this.idx(nb.x, nb.z)])) { nb.burning = true; nb.fireMonths = 0; this.markChunk(nb.x, nb.z); this.dirty.buildings = true; }
          }
          if ((b.truckArrived && Math.random() < 0.95) || (fc >= 0.25 && Math.random() < 0.55 + fc * 0.45)) {
            b.burning = false; b.fireMonths = 0; b.truckArrived = false; b.occ *= 0.6; this.counters.firesOut++;
            this.markChunk(b.x, b.z); this.dirty.buildings = true;
            this.event('Incêndio controlado pelos bombeiros. 🚒', 'good', b.x, b.z, 'log');
          } else if (b.fireMonths >= 3) {
            this.event(`🔥 O fogo destruiu ${LEVEL_NAMES[b.kind][b.level - 1].toLowerCase()} (${b.x}, ${b.z}). ${ISSUE_TIPS['Em chamas']}`, 'warn', b.x, b.z);
            this.removeBuilding(b);
          }
        } else if (!b.abandoned && b.cons === 0) {
          // incêndios só começam quando os bombeiros já podem ser construídos
          const ramp = clamp((this.maxPop - DEFS.fire.unlock) / 300, 0, 1);
          const risk = ramp * (b.kind === 'I' ? 0.003 : b.kind === 'C' ? 0.0011 : 0.0009) * (1 - fc * 0.9) * (b.level > 1 ? 1.2 : 1) * (this.policies.smoke ? 0.5 : 1);
          if (Math.random() < risk) {
            b.burning = true; b.fireMonths = 0; this.counters.fires++;
            this.markChunk(b.x, b.z); this.dirty.buildings = true;
            this.event(`🔥 Incêndio em ${LEVEL_NAMES[b.kind][b.level - 1].toLowerCase()}!${fc < 0.25 ? ' Não há bombeiros no alcance: construa um quartel a até 9 quadras.' : ' Os bombeiros estão a caminho.'}`, 'warn', b.x, b.z, 'urgent');
            burning++;
          }
        }
      }
      this.stats.burning = burning;
    }

    computeStats() {
      const s = this.stats;
      let pop = 0, jobsFilled = 0, jobsCap = 0, cCap = 0;
      let hR = 0, wR = 0, hC = 0, nC = 0, hI = 0, nI = 0, abandoned = 0, edu = 0, hl = 0, crime = 0, nZ = 0, deco = 0, building = 0;
      s.counts = { R: 0, C: 0, I: 0 }; s.levels = { R: [0, 0, 0], C: [0, 0, 0], I: [0, 0, 0] };
      for (const b of this.buildings) {

      const chk = (ok, t) => `<li class="${ok ? 'ok' : 'no'}">${ok ? '✅' : '❌'} ${t}</li>`;
      parts.push('<p class="sub">Para um prédio nascer aqui:</p><ul class="checks">' +
        chk(c.roadNear[i], 'Rua a até 2 quadras') + chk(c.powerCov[i], 'Energia (usina no alcance)') + chk(c.waterCov[i], "Água (caixa d'água no alcance)") +
        chk(c.demand[k] > 0.03, `Demanda ${ZONE_NAMES[k].toLowerCase()} (hoje ${Math.round(c.demand[k] * 100)}%)`) + chk(!c.stats.powerShort && !c.stats.waterShort, 'Energia e água suficientes na cidade') + '</ul>');
      common();
      parts.push('<div class="actions"><button class="btn ghost" data-walk>Andar aqui</button><button class="btn ghost" data-demolish>Remover zona</button></div>');
    } else {
      const names = { 0: 'Gramado', 1: 'Água', 2: 'Praia', 3: 'Floresta' };
      title = names[c.terrain[i]];
      if (!c.isOwned(x, z)) parts.push(`<p class="sub">Terreno fora da cidade. Compre na categoria ⛰️ Terreno por ${fmt(c.parcelPrice())}.</p>`);
      else if (c.terrain[i] === T.WATER) parts.push('<p class="sub">Dá para fazer uma ponte (desenhe uma rua por cima), aterrar ou colocar uma orla na margem. Quem mora perto da água fica mais feliz.</p>');
      else if (c.terrain[i] === T.FOREST) parts.push('<p class="sub">Árvores reduzem a poluição. Zonear ou abrir rua aqui derruba a mata.</p>');
      else parts.push('<p class="sub">Terreno livre para ruas, zonas, serviços ou decoração.</p>');
      common();
      parts.push(`<div class="row"><span>Posição</span><b>${x}, ${z}</b></div>`);
      if (c.terrain[i] !== T.WATER && c.isOwned(x, z)) parts.push('<div class="actions"><button class="btn ghost" data-walk>Andar aqui</button></div>');
    }
    return { title, html: parts.join(''), after };
  }

  function sparkline(hist, key, col) {
    if (hist.length < 2) return '';
    const vals = hist.slice(-60).map(h => h[key]);
    const mx = Math.max(...vals, 1), mn = Math.min(...vals, 0);
    const w = 260, h = 44;
    const pts = vals.map((v, i) => `${(i / (vals.length - 1) * w).toFixed(1)},${(h - 4 - (v - mn) / (mx - mn || 1) * (h - 8)).toFixed(1)}`);
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="${col}" stroke-width="2" points="${pts.join(' ')}"/></svg>`;
  }

      <div class="row"><span>Trânsito congestionado</span><b class="${s.congestion > 0.3 ? 'bad' : ''}">${pct(s.congestion)} das ruas</b></div>

      <div class="row"><span>Prédios</span><b>🏠 ${s.counts.R} · 🏪 ${s.counts.C} · 🏭 ${s.counts.I}${s.building ? ` · 🏗️ ${s.building} em obras` : ''}${s.abandoned ? ` · <span class="bad">${s.abandoned} abandonados</span>` : ''}${s.burning ? ` · <span class="bad">🔥 ${s.burning}</span>` : ''}</b></div>
      <div class="row"><span>Nas ruas agora</span><b>🚗 ${ag.vehicles} · 🚶 ${ag.people}</b></div>

  // conselheiro: os maiores problemas da cidade e o que fazer com cada um
  function advisorHtml() {
    const s = state.city.stats, iss = s.issues || [];
    if (!s.hasR) return '<h4>Conselheiro</h4><div class="advisor-ok"><p class="sub">Zoneie casas ao lado de uma rua ligada à rodovia: a primeira família chega de caminhão. 🚚</p></div>';
    if (!iss.length) return '<h4>Conselheiro</h4><div class="advisor-ok"><b>Nenhum problema grande no momento. 👍</b><p class="sub">Continue crescendo: siga as metas e fique de olho nas notícias 📰.</p></div>';
    const mx = Math.max(12, iss[0].w);
    return '<h4>Conselheiro</h4><p class="sub">O que mais incomoda os moradores hoje, do pior para o menor:</p>' + iss.map(e => `<div class="issue"><div class="row"><span>${esc(e.label)}${e.n ? ` <small>· ${plural(e.n, 'prédio', 'prédios')}</small>` : ''}</span><b class="${e.w >= 8 ? 'bad' : 'warn'}">${e.w >= 8 ? 'grave' : 'moderado'}</b></div>${bar(e.w / mx, e.w >= 8 ? 'var(--bad)' : 'var(--warn)')}<p class="sub">${esc(e.tip)}</p></div>`).join('');
  }
  function renderMissions() {
    const c = state.city;
    const parts = [advisorHtml()];
    const ms = c.missionStatus();
    parts.push('<h4>Missões</h4>');
    if (ms) {
      const m = ms.mission;
      parts.push(`<div class="mission current"><div class="mh"><span class="num">Missão ${ms.idx + 1} de ${MISSIONS.length}</span><b>${esc(m.title)}</b></div><p>${esc(m.desc)}</p>${bar(ms.goal ? ms.cur / ms.goal : 0, 'var(--accent)')}<div class="row"><span>${ms.cur.toLocaleString('pt-BR')} / ${ms.goal.toLocaleString('pt-BR')} ${esc(ms.unit || '')}${ms.hint && ms.cur >= ms.goal ? ` · falta: ${esc(ms.hint)}` : ''}</span><b class="good">+${fmt(m.reward)}</b></div></div>`);
    } else parts.push('<div class="mission current"><b>Todas as missões concluídas!</b><p class="sub">A cidade é sua: continue construindo do seu jeito.</p></div>');
    if (c.missionIdx > 0) parts.push('<h4>Concluídas</h4><ul class="done">' + MISSIONS.slice(0, c.missionIdx).map(m => `<li>✅ ${esc(m.title)} <small>+${fmt(m.reward)}</small></li>`).join('') + '</ul>');
    const next = MISSIONS.slice(c.missionIdx + 1, c.missionIdx + 3);
    if (next.length) parts.push('<h4>Próximas</h4><ul class="done muted">' + next.map(m => `<li>▫️ ${esc(m.title)}</li>`).join('') + '</ul>');
    parts.push(`<h4>Conquistas <span>${c.achievements.length} / ${ACHIEVEMENTS.length}</span></h4><div class="ach">` + ACHIEVEMENTS.map(a => {
      const got = c.achievements.includes(a.id);
      return `<div class="ach-card ${got ? 'got' : ''}"><b>${got ? '🏆' : '🔒'} ${esc(a.title)}</b><small>${esc(a.desc)}</small></div>`;
    }).join('') + '</div>');
    return { title: 'Metas e conselheiro', html: parts.join('') };
  }

  function renderNews() {
    const c = state.city; const items = c.log.slice().reverse();
    const html = items.length
      ? '<p class="sub">Tudo o que aconteceu na cidade, do mais recente para o mais antigo.</p><ul class="news">' + items.map((e, i) => `<li class="${esc(e.kind || 'info')}"><small>${MONTHS[((e.m || 1) - 1 + 12) % 12]} · ano ${e.y || 1}</small><span>${esc(e.text)}</span>${(e.x !== undefined && e.x !== null) ? `<button class="btn small ghost" type="button" data-go="${items.length - 1 - i}">Ver</button>` : ''}</li>`).join('') + '</ul>'
      : '<p class="sub">Nada aconteceu ainda. As notícias da cidade ficam guardadas aqui, sem atrapalhar a tela.</p>';
    return {
      title: 'Notícias', html, after: body => body.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => {
        const e = c.log[Number(b.dataset.go)]; if (!e) return;
        if (state.explore) exitExplore();
        R3.centerOn(e.x, e.z); openPanel('info', { x: e.x, z: e.z }); sfx('click');
      }))
    };
  }

    for (const [k, o] of Object.entries(R3.OVERLAYS)) (groups[o.group] = groups[o.group] || []).push([k, o.name]);

      title: 'Mapas', html, after: body => body.querySelectorAll('[data-ov]').forEach(b => b.addEventListener('click', () => {
        state.overlay = b.dataset.ov || null; R3.setOverlay(state.overlay); sfx('click'); renderPanel();

      title: 'Estilo visual', html, after: body => body.querySelectorAll('[data-style]').forEach(b => b.addEventListener('click', () => {
        const k = b.dataset.style; R3.setStyle(k); state.settings.style = k; saveSettings(); sfx('click');
        const c = state.city; c.counters.styles = c.counters.styles || []; if (!c.counters.styles.includes(k)) c.counters.styles.push(k);
        state.dbDirty = true; renderPanel();

    };
