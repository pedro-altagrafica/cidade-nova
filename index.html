  /* ---------- modais ---------- */
  function openModal(html, after) {
    const m = $('#modal'); $('#modal-card').innerHTML = html; m.hidden = false;
    if (after) after($('#modal-card'));
  }
  function closeModal() { $('#modal').hidden = true; $('#modal-card').innerHTML = ''; }
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

  function landDialog(p) {
    const c = state.city;
    const chk = c.canBuyParcel(p);
    if (c.owned[p]) { toast('Este terreno já é seu.', 'info', 2000); return; }
    if (!chk.ok && !chk.price) { toast(chk.reason, 'warn'); sfx('error'); return; }
    const price = chk.price || c.parcelPrice();
    openModal(`<h2>Comprar terreno</h2><p>Lote de ${PARCEL}×${PARCEL} quadras por <b>${fmt(price)}</b>. Você tem ${fmt(c.money)}.</p>${chk.ok ? '' : `<p class="sub bad">${esc(chk.reason)}</p>`}<div class="actions"><button class="btn ghost" id="ld-cancel">Cancelar</button><button class="btn" id="ld-ok" ${chk.ok ? '' : 'disabled'}>Comprar</button></div>`, card => {
      card.querySelector('#ld-cancel').addEventListener('click', closeModal);
      card.querySelector('#ld-ok').addEventListener('click', () => { const r = c.buyParcel(p); closeModal(); if (r.ok) { sfx('buy'); state.dbDirty = true; R3.setRect(null); } else toast(r.reason, 'warn'); });
    });
  }

  function showTutorial(fromMenu) {
    const steps = [
      ['Bem-vindo, prefeito!', 'Você constrói, os moradores chegam. Arraste com um dedo para mover a câmera; com dois dedos você gira e dá zoom. No computador: botão direito gira e a roda do mouse aproxima.'],
      ['Construir em dois toques', 'Escolha uma ferramenta e toque no mapa: aparece a prévia. Toque de novo no mesmo lugar para construir. Ruas e zonas: um toque em cada ponta e outro no fim. Os prédios viram a frente para a rua sozinhos. Assim você arrasta a câmera à vontade sem construir sem querer.'],
      ['A rodovia e as ruas', 'A rodovia estadual chega pela borda do mapa: ligue suas ruas nela, porque é por ela que vêm moradores, visitantes e caminhões. Prédios só nascem até 2 quadras de uma 🛣️ rua. Pinte zonas de 🏠 casas, 🏪 lojas e 🏭 indústrias ao lado das ruas.'],
      ['Energia e serviços', 'As zonas precisam de ⚡ energia e 💧 água no alcance para crescer. Ao escolher um serviço, a área que ele atende aparece colorida no chão. Depois vêm polícia, bombeiros (incêndios acontecem!), escola, lixo e transporte.'],
      ['Problemas e notícias', 'Toque em qualquer prédio para ver o que falta nele. Em 🎯 Metas, o conselheiro lista os maiores problemas da cidade e o que fazer. O 📰 guarda todas as notícias, e o aviso no alto da tela leva direto ao problema.'],
      ['Seu jeito', 'Em 🏗️ Prédios e 🌳 Lazer você coloca construções à mão e gira com 🔄. Em 🎨 Estilo muda a cara da cidade. E em 🚶 Passear você anda, dirige e tira fotos.'],
    ];
    let i = 0;
    const render = () => openModal(`<h2>${esc(steps[i][0])}</h2><p>${esc(steps[i][1])}</p><div class="dots">${steps.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div><div class="actions"><button class="btn ghost" id="tut-skip">${i < steps.length - 1 ? 'Pular' : 'Fechar'}</button>${i < steps.length - 1 ? '<button class="btn" id="tut-next">Próximo</button>' : '<button class="btn" id="tut-next">Começar</button>'}</div>`, card => {
      card.querySelector('#tut-skip').addEventListener('click', done);
      card.querySelector('#tut-next').addEventListener('click', () => { if (i < steps.length - 1) { i++; render(); } else done(); });
    });
    const done = () => { closeModal(); state.settings.tutorialSeen = true; saveSettings(); if (!fromMenu) selectCat('roads'); };
    render();
  }

  function showNotes() {
    const list = (VER.notes || []).map(t => `<li>${esc(t)}</li>`).join('');
    openModal(`<h2>Novidades da versão ${VER.v}</h2><p class="sub">${esc(verDate())}</p><ul class="notes">${list}</ul><div class="actions"><button class="btn" id="nt-ok">Legal!</button></div>`, card => card.querySelector('#nt-ok').addEventListener('click', closeModal));
  }
  // ----- tela de entrada: a cidade gira devagar ao fundo até o jogador tocar em continuar -----
  function introText() {
    const c = state.city; if (!c) return;
    const fresh = state.introSource === 'new';
    $('#in-go').textContent = fresh ? '▶ Começar' : '▶ Continuar';
    $('#in-city').textContent = fresh ? 'Uma cidade novinha espera por você.' : `${c.name} · ano ${c.year} · ${Math.round(c.stats.pop || 0).toLocaleString('pt-BR')} habitantes`;
    $('#in-ver').textContent = `Versão ${VER.v}${verDate() ? ' · ' + verDate() : ''} · ver novidades`;
  }
  function openIntro(source) {
    state.introSource = source; state.introOn = true; state.introCam = R3.getCam(); state.introSpeed = state.speed || 1; state.speed = 0;
    const cm = state.introCam; R3.setCam({ pitch: 0.72, dist: Math.min(40, Math.max(20, cm.dist * 1.6)) });
    introText(); $('#intro').hidden = false; $('#intro').classList.remove('out'); document.body.classList.add('intro-on');
    $('#in-go').onclick = () => closeIntro();
    $('#in-new').onclick = () => { closeIntro(true); setTimeout(newGameDialog, 250); };
    $('#in-opts').onclick = () => { closeIntro(true); setTimeout(() => togglePanel('menu'), 250); };
    $('#in-ver').onclick = () => showNotes();
  }
  function closeIntro(quiet) {
    if (!state.introOn) return;
    state.introOn = false; try { Snd.resume(); } catch (_) { }
    const el = $('#intro'); el.classList.add('out'); document.body.classList.remove('intro-on'); setTimeout(() => { el.hidden = true; }, 600);
    if (state.introCam) R3.setCam(state.introCam);
    state.speed = state.introSpeed || 1; document.querySelectorAll('#speed button').forEach(b => b.classList.toggle('on', Number(b.dataset.speed) === state.speed));
    sfx('click');
    const seen = state.settings.lastVer; state.settings.lastVer = VER.v; saveSettings();
    if (quiet) return;
    if (state.introSource === 'new' && !state.settings.tutorialSeen) { setTimeout(() => showTutorial(false), 350); return; }
    if (seen && seen < VER.v && (VER.notes || []).length) setTimeout(showNotes, 450);
  }
  function newGameDialog() {
    const mapOpts = Object.entries(SCENARIOS.map).map(([k, n]) => `<option value="${k}">${esc(n)}</option>`).join('');
    const diffOpts = Object.entries(SCENARIOS.diff).map(([k, d]) => `<option value="${k}" ${k === 'normal' ? 'selected' : ''}>${esc(d.name)} ($ ${d.money.toLocaleString('pt-BR')})</option>`).join('');
    openModal(`<h2>Nova cidade</h2><p class="sub">A cidade atual será substituída. Salve ou exporte antes, se quiser guardar.</p>
      <label class="field">Nome<input id="ng-name" type="text" maxlength="28" value="Cidade Nova"></label>
      <label class="field">Tipo de mapa<select id="ng-map">${mapOpts}</select></label>
      <label class="field">Dificuldade<select id="ng-diff">${diffOpts}</select></label>
      <label class="field">Semente do mapa (opcional)<input id="ng-seed" type="text" inputmode="numeric" placeholder="aleatória"></label>
      <label class="switch"><input type="checkbox" id="ng-starter" checked><span>Começar com um bairro inicial</span></label>
      <div class="actions"><button class="btn ghost" id="ng-cancel">Cancelar</button><button class="btn" id="ng-ok">Criar cidade</button></div>`, card => {
      card.querySelector('#ng-cancel').addEventListener('click', closeModal);
      card.querySelector('#ng-ok').addEventListener('click', () => {
        const seedTxt = card.querySelector('#ng-seed').value.trim();
        let seed; if (seedTxt) { seed = 0; for (const ch of seedTxt) seed = (seed * 31 + ch.charCodeAt(0)) >>> 0; if (/^\d+$/.test(seedTxt)) seed = Number(seedTxt) >>> 0; }
        const name = card.querySelector('#ng-name').value.trim() || 'Cidade Nova';
        const starter = card.querySelector('#ng-starter').checked;
        const scen = { map: card.querySelector('#ng-map').value, diff: card.querySelector('#ng-diff').value };
        closeModal(); closePanel();
        startNewCity(seed, name, starter, scen);
      });
    });
  }
  function startNewCity(seed, name, starter, scen) {
    const c = new City(seed, scen); c.name = name || 'Cidade Nova';
    if (starter) c.applyStarter();
    adoptCity(c);
    R3.setCam({ tx: 0, tz: 0, yaw: 0.7, pitch: 0.95, dist: 26 }); R3.setTod(0.32);
    saveLocal(); state.dbDirty = true; scheduleCloudSave(true);
    toast(starter ? 'Cidade criada com um bairro inicial. Expanda com 🛣️ Ruas.' : 'Mapa novo. Ligue uma 🛣️ rua na rodovia para começar.', 'good');
  }
  function adoptCity(c) {
    if (state.explore) exitExplore();
    clearPending();
    state.city = c; R3.setCity(c); refreshToolLocks();
    state.overlay = null; R3.setOverlay(null);
    state.unread = 0; updateNewsBadge(); state.coverFromPanel = false;
    if (state.panel) renderPanel();
    updateHUD();
    if (state.introOn) { state.introSource = 'local'; introText(); state.introCam = R3.getCam(); }
  }

  function viewState() { return { cam: R3.getCam(), tod: R3.getTod(), style: R3.styleName }; }
  function applyView(v) { if (!v) return; if (v.cam) R3.setCam(v.cam); if (typeof v.tod === 'number') R3.setTod(v.tod); if (v.style && R3.STYLES[v.style]) R3.setStyle(v.style); }

  function exportCity() {
    const data = state.city.serialize(viewState()); const json = JSON.stringify(data);
    const fname = `${state.city.name.replace(/[^\w\- ]+/g, '').trim() || 'cidade'}.json`;
    const fallback = () => openModal(`<h2>Exportar cidade</h2><p class="sub">Copie o texto abaixo e guarde num arquivo. Para importar, cole o mesmo texto em Menu → Importar.</p><textarea id="exp-txt" readonly rows="6">${esc(json)}</textarea><div class="actions"><button class="btn ghost" id="exp-close">Fechar</button><button class="btn" id="exp-copy">Copiar</button></div>`, card => {
      const ta = card.querySelector('#exp-txt');
      card.querySelector('#exp-close').addEventListener('click', closeModal);
      card.querySelector('#exp-copy').addEventListener('click', () => {
        const ok = () => toast('Copiado.', 'good', 2000);
        const sel = () => { ta.focus(); ta.select(); toast('Selecionado: use copiar do seu aparelho.', 'info'); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(json).then(ok, sel); else sel();
      });
    });
    if (state.downloads) {
      state.downloads.save({ filename: fname, data: json }).then(() => toast('Arquivo salvo.', 'good', 2500)).catch(err => { if (err && err.code === 'declined') return; fallback(); });
    } else fallback();
  }
  function importDialog() {
    openModal(`<h2>Importar cidade</h2><p class="sub">Cole o texto exportado ou escolha o arquivo .json. Cidades das versões anteriores também funcionam.</p>
      <textarea id="imp-txt" rows="5" placeholder='{"v":3,...}'></textarea>
      <label class="field">Arquivo<input type="file" id="imp-file" accept=".json,application/json"></label>
      <div class="actions"><button class="btn ghost" id="imp-cancel">Cancelar</button><button class="btn" id="imp-ok">Importar</button></div>`, card => {
      card.querySelector('#imp-cancel').addEventListener('click', closeModal);
      card.querySelector('#imp-file').addEventListener('change', e => {
        const f = e.target.files && e.target.files[0]; if (!f) return;
        const rd = new FileReader(); rd.onload = () => { card.querySelector('#imp-txt').value = String(rd.result); }; rd.readAsText(f);
      });
      card.querySelector('#imp-ok').addEventListener('click', () => {
        const txt = card.querySelector('#imp-txt').value.trim();
        try {
          const data = JSON.parse(txt); const c = City.deserialize(data);
          closeModal(); closePanel(); adoptCity(c); applyView(data.view); saveLocal(); state.dbDirty = true; scheduleCloudSave(true);
          toast('Cidade importada.', 'good');
        } catch (err) { toast('Não consegui ler esse arquivo: ' + (err.message || 'formato inválido.'), 'warn'); }
      });
    });
  }

  /* ---------- salvar / carregar ---------- */
  function saveSettings() { lsSet(SET_KEY, state.settings); }
  function saveLocal() { return lsSet(SAVE_KEY, state.city.serialize(viewState())); }
  function loadLocal() { return lsGet(SAVE_KEY); }

  async function initCloud() {
    const C = window.claude;
    if (!C || typeof C.use !== 'function') return;
    try {
      const [db, user, dl] = await Promise.all([C.use('db'), C.use('user'), C.use('downloads')]);
      state.downloads = dl || null;
      if (!db || !user) return;
      const uid = await user.id(); if (!uid) return;
      state.cloudDoc = db.doc('data/users/' + uid + '/city');
      const snap = await state.cloudDoc.get();
      if (snap.exists) {
        const data = snap.data();
        const localAt = state.city ? (state.city.loadedAt || 0) : 0;
        if (data && (data.v === 1 || data.v === 2 || data.v === 3) && data.savedAt && data.savedAt > localAt + 30000 && !state.cloudLoadedOnce) {
          const sameCity = state.city && data.seed === state.city.seed;
          if (!state.hasLocalSave || sameCity && data.stepCount >= (state.city.stepCount || 0)) {
            adoptCity(City.deserialize(data)); applyView(data.view); state.city.loadedAt = data.savedAt;
            toast('Continuando a cidade salva na sua conta.', 'good');
          } else offerCloudLoad(data);
        }
      }
      state.cloudLoadedOnce = true;
      if (state.panel === 'menu') renderPanel();
    } catch (e) { /* sem nuvem: segue só com o aparelho */ }
  }
  function offerCloudLoad(data) {
    const el = document.createElement('div'); el.className = 'toast act';
    el.innerHTML = `<span>Há uma cidade mais recente salva na sua conta (${esc(data.name || 'cidade')}, ano ${data.year}).</span><button class="btn small" id="cl-yes">Carregar</button><button class="btn small ghost" id="cl-no">Ignorar</button>`;
    $('#toasts').appendChild(el);
    el.querySelector('#cl-yes').addEventListener('click', () => { try { adoptCity(City.deserialize(data)); applyView(data.view); state.city.loadedAt = data.savedAt; saveLocal(); } catch (e) { toast('Não consegui carregar.', 'warn'); } el.remove(); });
    el.querySelector('#cl-no').addEventListener('click', () => { el.remove(); state.dbDirty = true; });
  }
  function scheduleCloudSave(force) {
    if (!state.cloudDoc || state.cloudSaving) return;
    const now = Date.now();
    if (!force && (!state.dbDirty || now - state.lastCloudSave < 45000)) return;
    if (!state.dbDirty && !force) return;
    state.cloudSaving = true; state.dbDirty = false; state.lastCloudSave = now;
    const data = state.city.serialize(viewState());
    state.cloudDoc.set(data).then(() => { state.city.loadedAt = data.savedAt; }).catch(() => { state.dbDirty = true; }).finally(() => { state.cloudSaving = false; });
  }

  /* ---------- ciclo principal ---------- */
  function onMonth() {
    const c = state.city;
    state.monthsSinceSave++;
    const tr = R3.takeTravel(); if (tr.walked || tr.driven) { c.counters.distWalked += tr.walked; c.counters.distDriven += tr.driven; }
    if (state.monthsSinceSave >= 2) { state.monthsSinceSave = 0; saveLocal(); state.dbDirty = true; scheduleCloudSave(false); }
    if (c.month % 3 === 0) refreshToolLocks();
    if (state.panel === 'budget' || state.panel === 'missions' || (state.panel === 'info' && c.month % 2 === 0)) renderPanel();
    if (state.pending && state.pending.mode !== 'place') showPending(); // o preço pode ter mudado
  }
  function loop(now) {
    requestAnimationFrame(loop);
    const c = state.city; if (!c) return;
    const dtReal = Math.min(0.1, (now - state.last) / 1000 || 0); state.last = now;
    const sp = document.hidden ? 0 : state.speed;
    state.acc += dtReal * 1000 * sp;
    let steps = 0;
    while (state.acc >= STEP_MS && steps < 12) { c.step(); state.acc -= STEP_MS; steps++; }
    if (steps >= 12) state.acc = 0;
    if (steps) flushEvents();
    if (c.monthChanged) { c.monthChanged = false; onMonth(); }
    if (state.introOn) { const cm = R3.getCam(); R3.setCam({ yaw: cm.yaw + dtReal * 0.07 }); }
    R3.frame(dtReal, sp);
    state.hudTimer += dtReal;
    if (state.hudTimer > 0.25) { state.hudTimer = 0; updateHUD(); }
  }

  /* ---------- início ---------- */
  function start(hot) {
    if (typeof THREE === 'undefined') {
      document.body.insertAdjacentHTML('beforeend', '<div class="fatal">Não consegui carregar o motor 3D. Verifique a conexão e recarregue a página.</div>');
      return;
    }
    Object.assign(state.settings, lsGet(SET_KEY) || {});
    Snd.setEnabled('sfx', state.settings.sfx !== false); Snd.setEnabled('music', state.settings.music !== false);
    R3.init(cv);
    R3.setShadows(state.settings.shadows !== false);
    R3.setQuality(state.settings.quality || 'auto');
    let city = null, source = 'new', view = null;
    if (hot && hot.save) { try { city = City.deserialize(hot.save); view = hot.save.view; source = 'hot'; } catch (e) { city = null; } }
    if (!city) {
      const local = loadLocal();
      if (local) { try { city = City.deserialize(local); view = local.view; source = 'local'; city.loadedAt = local.savedAt || 0; state.hasLocalSave = true; if (local.v === 1) toast('Sua cidade foi colocada no centro de um mapa 4× maior, com relevo e terrenos para comprar.', 'good', 7000); } catch (e) { city = null; } }
    }
    if (!city) { city = new City(); city.applyStarter(); }
    state.city = city;
    buildToolbar();
    if (!R3.STYLES[state.settings.style]) { state.settings.style = 'tropical'; saveSettings(); } // o estilo Pixel art foi retirado
    if (state.settings.style && R3.STYLES[state.settings.style]) R3.setStyle(state.settings.style);
    R3.setCity(city);
    applyView(view);
    updateHUD();
    // tela de entrada (não aparece em recarga a quente nem em testes automáticos)
    if (source !== 'hot' && !navigator.webdriver) openIntro(source);
    else { if (!state.settings.lastVer) { state.settings.lastVer = VER.v; saveSettings(); } if (source === 'new' && !state.settings.tutorialSeen) showTutorial(false); }
    if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function') {
      try { window.claude.hot.snapshot(() => ({ save: state.city.serialize(viewState()) })); } catch (e) { }
    }
    initCloud();
    $('#btn-menu').addEventListener('click', () => { togglePanel('menu'); sfx('click'); });
    $('#btn-news').addEventListener('click', () => { togglePanel('news'); sfx('click'); });
    $('#hud-warn').addEventListener('click', onWarnClick);
    $('#panel-close').addEventListener('click', closePanel);
    $('#mission-chip').addEventListener('click', () => togglePanel('missions'));
    document.querySelectorAll('#speed button').forEach(b => b.addEventListener('click', () => { setSpeed(Number(b.dataset.speed)); sfx('click'); }));
    window.addEventListener('resize', () => R3.resize());
    window.addEventListener('orientationchange', () => setTimeout(() => R3.resize(), 300));
    document.addEventListener('visibilitychange', () => { if (document.hidden) { saveLocal(); scheduleCloudSave(true); } else state.last = performance.now(); });
    window.addEventListener('pagehide', () => saveLocal());
    selectCat('hand');
    window.CidadeNova = { get city() { return state.city; }, adoptCity, openIntro, closeIntro, showNotes, R3, Sim, enterExplore, exitExplore, selectCat, setTool, tapTile, confirmPending, clearPending, openPanel, get state() { return state; } };
    if (source === 'new') saveLocal();
    state.last = performance.now();
    requestAnimationFrame(loop);
  }
  const boot = () => {
    try {
      const hot = window.claude && window.claude.hot;
      if (hot && typeof hot.ready === 'function') hot.ready(start);
      else start((hot && hot.data) || {});
    } catch (e) { start({}); }
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>

<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
</script>
